plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdk 36
    ndkVersion '27.0.12077973'

    namespace "pl.leancode.patrol.challenge"
    
    // Suppress AAR metadata check errors from pre-built libraries with lower compileSdk
    packagingOptions {
        pickFirst 'META-INF/proguard/androidx-*.pro'
    }
    
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
    }

    defaultConfig {
        applicationId "pl.leancode.patrol.challenge"
        minSdkVersion 24  // Required by geolocator_android
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"
    }

    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
        // Disable strict manifest merger checks for androidTest
        unitTests.all {
            it.useTestOrchestrator = true
        }
    }
    
    // Handle manifest merger issues with firebase_auth and other libraries
    packagingOptions {
        resources {
            excludes += ['META-INF/proguard/androidx-*.pro']
        }
    }
    
    // Suppress manifest merger errors from plugin libraries
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    
    // Configure manifest merger to be more lenient with plugin libraries
    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // Flavors commented out for Patrol testing compatibility
    // flavorDimensions "default"
    //
    // productFlavors {
    //     dev {
    //         dimension "default"
    //         resValue "string", "app_name", "DEV Challenge"
    //         applicationIdSuffix ".dev"
    //     }
    //
    //     prod {
    //         dimension "default"
    //         resValue "string", "app_name", "Challenge"
    //     }
    // }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
}

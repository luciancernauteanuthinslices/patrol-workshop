name: Android instrumentation via emulator.wtf

on:
  push:
    branches: [ main, patrol_challenge ]
  pull_request:

jobs:
  ewt-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api: [31, 34]
        model: [Pixel5]   # change to a supported id if you prefer another device

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Sets ANDROID_SDK_ROOT and accepts licenses (helps Gradle resolve SDKs)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter deps
        run: flutter pub get

      # Install NDK
      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      # Set up local.properties with SDK, NDK, and Flutter paths
      - name: Set up local.properties
        run: |
          FLUTTER_ROOT=$(which flutter | sed 's/\/bin\/flutter$//')
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      # Print environment info for debugging
      - name: Flutter and environment info
        run: |
          flutter --version
          flutter doctor -v
          java -version
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          cat android/local.properties || true
          ls -la $ANDROID_SDK_ROOT || true

      # Build app + androidTest APKs (wrapper is under android/)
      - name: Assemble APKs (with detailed logging)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleAndroidTest --stacktrace --info 2>&1 | tee ../gradle_build.log

      # Verify APKs were created
      - name: Verify APKs exist
        run: |
          echo "Checking for APK files..."
          ls -lah android/app/build/outputs/apk/debug/ || echo "Debug APK directory not found"
          ls -lah android/app/build/outputs/apk/androidTest/debug/ || echo "AndroidTest APK directory not found"
          
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk not found!"
            exit 1
          fi
          
          if [ ! -f "android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" ]; then
            echo "ERROR: app-debug-androidTest.apk not found!"
            exit 1
          fi
          
          echo "✓ Both APKs found successfully"

      # Upload Gradle build log for debugging
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-api${{ matrix.api }}
          path: gradle_build.log

      # Run tests on emulator.wtf for the current matrix device/api
      - name: Run tests on emulator.wtf (API ${{ matrix.api }})
        id: ewt
        uses: emulator-wtf/run-tests@v0
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          app: android/app/build/outputs/apk/debug/app-debug.apk
          test: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          # one or more devices (comma-separated or multi-line)
          devices: model=${{ matrix.model }},version=${{ matrix.api }},locale=en,orientation=portrait
          # artifacts/junit from this run will be written here:
          outputs-dir: ewt-results-${{ matrix.api }}
          # useful options
          num-flaky-test-attempts: 1
          timeout: 15m
          use-orchestrator: true
          clear-package-data: true

      # Publish JUnit to the PR summary
      - name: JUnit report (API ${{ matrix.api }})
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ewt-results-${{ matrix.api }}/**/*.xml
          check_name: "Instrumentation (API ${{ matrix.api }})"
          fail_on_failure: true

      # Upload raw artifacts from emulator.wtf (videos, logs, junit.xml)
      - name: Upload artifacts (API ${{ matrix.api }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ewt-results-api${{ matrix.api }}
          path: ewt-results-${{ matrix.api }}/

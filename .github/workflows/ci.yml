name: Android instrumentation via emulator.wtf

on:
  push:
    branches: [ main, patrol_challenge ]
  pull_request:

jobs:
  ewt-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        api: [31, 34]
        model: [Pixel2]   # use a valid model ID from emulator.wtf

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin) with Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Sets ANDROID_SDK_ROOT and accepts licenses (helps Gradle resolve SDKs)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # Build debug APKs and Android App Bundle
      - name: Build APKs and Bundle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug :app:assembleAndroidTest bundleRelease

      # Verify APKs were created
      - name: Verify APKs exist
        run: |
          echo "Checking for APK files..."
          if [ ! -f "build/app/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk not found!"
            exit 1
          fi
          
          if [ ! -f "build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk" ]; then
            echo "ERROR: app-debug-androidTest.apk not found!"
            exit 1
          fi
          
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: app-release.aab not found!"
            exit 1
          fi
          
          echo "✓ All build artifacts found successfully"
          ls -lh build/app/outputs/apk/debug/app-debug.apk
          ls -lh build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      # Run tests on emulator.wtf for the current matrix device/api
      - name: Run tests on emulator.wtf (API ${{ matrix.api }})
        id: ewt
        uses: emulator-wtf/run-tests@v0
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          app: build/app/outputs/apk/debug/app-debug.apk
          test: build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          devices: model=${{ matrix.model }},version=${{ matrix.api }},locale=en,orientation=portrait
          outputs-dir: ewt-results-${{ matrix.api }}
          num-flaky-test-attempts: 1
          timeout: 15m
          use-orchestrator: true
          clear-package-data: true

      # Publish JUnit report to PR
      - name: Publish JUnit report (API ${{ matrix.api }})
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: ewt-results-${{ matrix.api }}/junit.xml
          check_name: "Instrumentation Tests (API ${{ matrix.api }})"
          fail_on_failure: true

      # Upload test artifacts (videos, logs, results)
      - name: Upload test artifacts (API ${{ matrix.api }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ewt-results-api${{ matrix.api }}
          path: ewt-results-${{ matrix.api }}/
          retention-days: 30
